# Actions are pinned to full SHAs in .github/workflows (protection against a tag being moved).
# Dependabot is therefore essential: without it, those frozen SHAs would never receive the
# upstream security fixes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # Conventional Commits: `ci` does not trigger a release (see release-please).
      prefix: ci
