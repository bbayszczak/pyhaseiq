name: Feature request
description: A change to the library
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        `pyhaseiq` is a **read-only** and **stateless** library: it queries the stove, nothing
        else. History, thresholds, notifications and any writing belong to the calling layer.
        See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md).
  - type: textarea
    id: need
    attributes:
      label: Need
      description: The concrete problem this solves, not the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you have in mind, and the validation status of the protocol if it is involved.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This proposal writes nothing to the stove and keeps no state in the library.
          required: true
