name: Bug report
description: Unexpected behaviour of the library or of the stove
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Two generations of stoves carry the name "Hase iQ".** This library only talks to
        **the old one**, the one driven by the `flamemonitor` application. If your stove is
        driven with the `HASE iQ` application, it will not work — that is not a bug.
  - type: dropdown
    id: generation
    attributes:
      label: Driving application
      description: The one you normally use with your stove.
      options:
        - flamemonitor (old generation — supported)
        - Hase iQ (new generation — not supported)
        - I don't know
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happens, and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The steps, and the minimal code that triggers the problem.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Stove versions
      description: >-
        Output of `uv run demo.py <ip> --request _oemver --request _wversion --request _oemdev`.
      placeholder: _oemver = AAF_5815=9, _wversion = 1.4, _oemdev = 2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15.4, Python 3.13, pyhaseiq 0.1.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The WebSocket dialogue if you have it (`demo.py --debug`). Rendered as a code block.
      render: text
