name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Keeps a release PR up to date from the Conventional Commits: it accumulates the CHANGELOG
  # and the version bump, and triggers tag + GitHub Release once merged.
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      # The GITHUB_TOKEN no longer carries any write access: the App token handles that.
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # release-please authenticates as a GitHub App rather than with the GITHUB_TOKEN, for two
      # reasons. The latter is denied PR creation as long as the repository's "Allow GitHub
      # Actions to create and approve pull requests" setting is unchecked; and above all its
      # writes trigger no workflow, so the release PR would never get the checks that main's
      # ruleset requires and would stay unmergeable. An App is a distinct identity: its events
      # do trigger the CI, and the installation token derived from it expires after an hour.
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps the version in pyproject.toml but ignores uv.lock, which also
      # carries the package version. Without a resync, the lockfile is stale as soon as the
      # release lands and the next `uv run` rewrites it. We fix it on the release PR branch,
      # before it is merged, so that main never receives a misaligned lockfile. `uv lock` reads
      # pyproject.toml back: the rule survives any change of version scheme.
      - name: Check out the release pull request branch
        if: steps.release.outputs.pr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}

      - name: Set up uv
        if: steps.release.outputs.pr
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Sync uv.lock with the bumped version
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # The short-circuit is not decorative: the expressions of a step's `env:` block are
          # evaluated before its `if:`, unlike those of a `with:`. On runs that publish a
          # release instead of opening a PR, `steps.release.outputs.pr` is empty; without the
          # guard, `fromJson` would receive the empty string and fail the step even though it
          # is meant to be skipped.
          BRANCH: ${{ steps.release.outputs.pr && fromJson(steps.release.outputs.pr).headBranchName || '' }}
        run: |
          uv lock
          if git diff --quiet uv.lock; then
            echo "uv.lock already in sync"
            exit 0
          fi
          # The commit goes through the API and not through `git commit`: main's ruleset
          # requires verified signatures, and a commit crafted in the runner is unsigned and
          # would block the merge of the release PR ("Commits must have verified signatures").
          # GitHub signs the commits created through its API by itself, as it already does for
          # release-please's own. `sha` is the file's blob as it stands on the branch: `uv
          # lock` modified the working copy, not HEAD.
          gh api -X PUT "repos/${{ github.repository }}/contents/uv.lock" \
            -f message="chore: sync uv.lock with the release version" \
            -f branch="$BRANCH" \
            -f sha="$(git rev-parse HEAD:uv.lock)" \
            -f content="$(base64 -w0 uv.lock)"

  # `uv build` runs the hatchling backend and its dependencies, i.e. third-party code. This job
  # is therefore deliberately deprived of `id-token: write`: a compromised build dependency
  # finds no OIDC token there that it could use to publish.
  # The distributions are also attached to the GitHub Release, from where they stay installable
  # off-index (`pip install <url of the .whl>`).
  build:
    name: Build distributions
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/*
      - name: Hand the distributions over to the publishing job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Trusted Publishing: PyPI authenticates the workflow on the OIDC token GitHub issues to it,
  # so there is no API token to store as a secret.
  # This job holds that token, so it is cut down to the strict minimum: no checkout, no
  # dependency, no code from the repository — only the already built distributions and the
  # publishing action. Nothing that runs there comes from a PR.
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # The action refuses to overwrite a version already present on PyPI: a replay of the
      # workflow fails instead of corrupting anything.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
